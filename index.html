<style>
/* Layout: a slot cabinet with 24 hourly reels (four 6-hour bands, two per row when wide) beside a live 24-hour 生活表 circle; a 総評 dialog after the spin; report cards below; one column on phones. */
:root{
  color-scheme:light;
  --bg:#E6EBEF; --ink:#17202A; --muted:#566271; --panel:#FFFFFF; --panel-2:#F1F4F7; --line:#CCD4DC; --focus:#1E66CF;
  --good:#1B7F45; --bad:#C0392F; --shadow:rgba(18,36,54,.42); --scrim:rgba(14,22,30,.58);
  --wedge-empty:#E1E6EB; --red-ink:#D3343B; --blue-ink:#2F62C0;
  /* machine: identical in both themes */
  --cab:#1D3245; --cab-2:#2A465E; --cab-3:#253F56; --cab-ink:#EAF0F5; --cab-muted:#9DB1C3;
  --amber:#F4B53F; --amber-deep:#C88A14; --amber-ink:#2A1C00;
  --lcd:#0C1217; --lcd-rim:#24384A; --lcd-ink:#FFC24A; --lcd-dim:#3A2F17; --lcd-glow:rgba(255,186,60,.45); --warn-lcd:#FF6B57;
  --stop:#E5483A; --stop-deep:#9E2A20; --stop-ink:#FFFFFF; --stop-glow:rgba(229,72,58,.5);
  --payline:rgba(244,181,63,.7); --reel-shade:rgba(6,10,18,.34);
  --paper:#FFFDF7; --paper-ink:#1F1F1F; --paper-edge:#D2CAB6; --toast-shadow:rgba(0,0,0,.35);
  --on-cat:#FFFFFF; --on-cat-dark:#1E1B16;
  --c-sleep:#7024D9; --c-meal:#EE862D; --c-work:#34BE6A; --c-fun:#F43096; --c-health:#154EF0; --c-life:#F65D46; --c-idle:#D76DF6; --c-lucky:#EDB80A;
  --c-sns:#1FC7E6;
  /* 行動ごとの色（リールの名札と枠、結果画像の枠） */
  --sw-blue:#154EF0; --sw-grape:#9032F2; --sw-green:#34BE6A; --sw-lime:#91D136; --sw-orange:#EE862D; --sw-orchid:#D76DF6; --sw-pink:#F43096; --sw-red:#F65D46; --sw-sunset:#F6496B; --sw-teal:#32B3B0; --sw-violet:#7024D9;
  /* ドパガキ演出: a deliberate neon look, identical in both themes */
  --neon-pink:#FF2BD6; --neon-cyan:#2BF3FF; --neon-yellow:#FFF23B; --neon-bg:#12001F; --neon-white:#FFFFFF; --veil:rgba(0,0,0,.82);
  --hit-gold:#FFD84A; --hit-red:#E3122B;
  /* 後半の演出レベル（青→緑→赤→金）とプチュンの暗転 */
  --lv-1:#3DA5FF; --lv-2:#2EE07A; --lv-3:#FF3D57; --lv-4:#FFD84A; --crt-off:#000000;
  --x-bg:#000000; --x-ink:#FFFFFF; --x-line:transparent;
  --brand-tw:#1D9BF0; --brand-yt:#FF0000;
  /* 朝まで飲み会: sunrise */
  --sun-1:#2A0F4D; --sun-2:#B0306E; --sun-3:#FF8A3D; --sun-4:#FFD36B; --nomi-shade:rgba(42,15,77,.55);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-lcd:"DotGothic16","MS Gothic",monospace;
  --f-hand:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#0D1216;--ink:#E3E9EE;--muted:#95A2AF;--panel:#151D24;--panel-2:#1B252E;--line:#2A3743;--focus:#7FB2FF;--good:#4CC27F;--bad:#FF7366;--shadow:rgba(0,0,0,.7);--scrim:rgba(0,0,0,.68);--wedge-empty:#222C35;--red-ink:#FF6B6F;--blue-ink:#7DA6FF;--x-line:rgba(255,255,255,.32)}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D1216;--ink:#E3E9EE;--muted:#95A2AF;--panel:#151D24;--panel-2:#1B252E;--line:#2A3743;--focus:#7FB2FF;--good:#4CC27F;--bad:#FF7366;--shadow:rgba(0,0,0,.7);--scrim:rgba(0,0,0,.68);--wedge-empty:#222C35;--red-ink:#FF6B6F;--blue-ink:#7DA6FF;--x-line:rgba(255,255,255,.32)}

/* 行動の色は、data-cat を付けた要素だけが使う（中の要素に受け継がせない。受け継ぐと、色が変わるたびに中身を全部計算し直す） */
@property --cat{syntax:"*";inherits:false}
@property --cat-ink{syntax:"*";inherits:false}
[data-cat="sleep"]{--cat:var(--c-sleep)}
[data-cat="meal"]{--cat:var(--c-meal);--cat-ink:var(--on-cat-dark)}
[data-cat="work"]{--cat:var(--c-work);--cat-ink:var(--on-cat-dark)}
[data-cat="fun"]{--cat:var(--c-fun);--cat-ink:var(--on-cat-dark)}
[data-cat="health"]{--cat:var(--c-health)}
[data-cat="life"]{--cat:var(--c-life);--cat-ink:var(--on-cat-dark)}
[data-cat="idle"]{--cat:var(--c-idle);--cat-ink:var(--on-cat-dark)}
[data-cat="sns"]{--cat:var(--c-sns);--cat-ink:var(--on-cat-dark)}
/* 行動ごとの色: 分類の色より後に書いて上書きする（名札と枠だけ。生活表は分類の色） */
[data-sw="blue"]{--cat:var(--sw-blue);--cat-ink:var(--on-cat)}
[data-sw="grape"]{--cat:var(--sw-grape);--cat-ink:var(--on-cat)}
[data-sw="green"]{--cat:var(--sw-green);--cat-ink:var(--on-cat-dark)}
[data-sw="lime"]{--cat:var(--sw-lime);--cat-ink:var(--on-cat-dark)}
[data-sw="orange"]{--cat:var(--sw-orange);--cat-ink:var(--on-cat-dark)}
[data-sw="orchid"]{--cat:var(--sw-orchid);--cat-ink:var(--on-cat-dark)}
[data-sw="pink"]{--cat:var(--sw-pink);--cat-ink:var(--on-cat-dark)}
[data-sw="red"]{--cat:var(--sw-red);--cat-ink:var(--on-cat-dark)}
[data-sw="sunset"]{--cat:var(--sw-sunset);--cat-ink:var(--on-cat-dark)}
[data-sw="teal"]{--cat:var(--sw-teal);--cat-ink:var(--on-cat-dark)}
[data-sw="violet"]{--cat:var(--sw-violet);--cat-ink:var(--on-cat)}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.emo{font-family:var(--f-emoji);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;overflow-x:clip}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.55rem,1.1rem + 1.8vw,2.3rem);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
.tag{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:700;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--muted)}
.ghost:disabled{opacity:.45;cursor:default}

/* identity select */
.select{display:flex;flex-direction:column;gap:12px}
.sel-h{margin:0;font-size:clamp(1.2rem,1rem + 1vw,1.6rem);text-wrap:balance}
.sel-sub{margin:0;color:var(--muted)}
.sel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:4px}
.idcard{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;cursor:pointer;transition:transform .15s,border-color .15s}
.idcard:hover{transform:translateY(-2px);border-color:var(--ink)}
.idc-top{display:flex;align-items:center;gap:12px}
.idc-ic{font-size:2.3rem;line-height:1}
.idc-n{font-family:var(--f-display);font-size:1.45rem;line-height:1.2}
.idc-blurb{color:var(--muted);font-size:.9rem}
.idc-sample{display:flex;flex-direction:column;gap:4px}
.idc-l{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.idc-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:.82rem;color:var(--muted)}
.idc-go{font-weight:700;color:var(--ink)}
.minibar{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:1px;height:14px;border-radius:4px;overflow:hidden}
.minibar i{background:var(--cat,var(--wedge-empty))}
.mb-scale{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* game layout */
.game{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1180px){
  .game{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
  .chartcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
}

/* machine */
.machine{position:relative;isolation:isolate;--lv-c:var(--amber);--lvo:0;--chase:1s;background:linear-gradient(180deg,var(--cab-2),var(--cab) 170px);color:var(--cab-ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px -22px var(--shadow)}
/* 後半ほど派手に: 18時から 青→緑→赤→金、大当たりの日は最後に虹。ランプの色と流れる速さ、台のまわりの光が変わる */
.machine[data-lv="1"] :is(.lamps,.glow,.callout),.machine[data-lv="1"]::after{--lv-c:var(--lv-1);--lvo:.10;--chase:.8s}
.machine[data-lv="2"] :is(.lamps,.glow,.callout),.machine[data-lv="2"]::after{--lv-c:var(--lv-2);--lvo:.14;--chase:.55s}
.machine[data-lv="3"] :is(.lamps,.glow,.callout),.machine[data-lv="3"]::after{--lv-c:var(--lv-3);--lvo:.18;--chase:.38s}
.machine[data-lv="4"] :is(.lamps,.glow,.callout),.machine[data-lv="4"]::after{--lv-c:var(--lv-4);--lvo:.22;--chase:.26s}
.machine[data-lv="5"] :is(.lamps,.glow,.callout),.machine[data-lv="5"]::after{--lv-c:var(--neon-pink);--lvo:.3;--chase:.18s}
.machine.kakutei::after{--lvo:.24}
.machine::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(110% 70% at 50% 55%,var(--lv-c),transparent 70%);opacity:var(--lvo);transition:opacity .4s}
.machine[data-lv="5"]::after,.machine.kakutei::after{animation:hue 1.2s linear infinite}
/* スマホ（.lite）は重い光り方を控える */
.lite .machine[data-lv="5"]::after,.lite .machine.kakutei::after,.lite .machine[data-lv="5"] .lamps,.lite .machine.kakutei .lamps,.lite .machine.premium .lamps,.lite .rc.last .win{animation:none}
.lite .lamps::before,.lite .lamps::after,.lite .dopa-lamps i{filter:none}
.lite .lamps{overflow:hidden}
.lite .lamps::before,.lite .lamps::after{left:-14px;animation-name:chaseX}
@keyframes chaseX{to{transform:translateX(14px)}}
.lite .machine.premium .bezel-wrap::before,.lite .machine.kakutei .bezel-wrap::before{filter:none;animation:none}
.lite .machine.rch .bezel{animation:none;box-shadow:inset 0 0 0 2px var(--amber-deep),0 0 0 4px var(--neon-pink),0 0 22px var(--neon-pink)}
.lite .machine.rch-hot .bezel{animation:none;box-shadow:inset 0 0 0 2px var(--amber-deep),0 0 0 4px var(--hit-red),0 0 26px var(--hit-red)}
.lite .machine.rch .rc.set .win{filter:none;opacity:.45}
.lite .callout.go.rainbow{animation:callIn 1.3s cubic-bezier(.2,1.4,.4,1) both}
.mtop{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:640px){.mtop{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"who who" "lcd mood";align-items:stretch}.who{grid-area:who}.lcds{grid-area:lcd}.mood{grid-area:mood}}
.who{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.who-ic{font-size:1.4rem;line-height:1;align-self:center}
.who b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.who-s{font-size:.85rem;color:var(--cab-muted)}
.sns{margin-left:auto;align-self:center;display:inline-flex;align-items:baseline;gap:4px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--cab-3);color:var(--cab-muted);white-space:nowrap}
.sns b{font-family:var(--f-lcd);font-weight:400;font-size:1.1rem;color:var(--c-sns)}
.sns small{font-size:.92em;font-weight:500}
.sns.near{background:var(--c-sns);color:var(--neon-bg);animation:throb2 .5s ease-in-out infinite alternate}
.sns.full{background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan),var(--neon-pink));background-size:300% 100%;color:var(--neon-bg);animation:shine 1.2s linear infinite}
.sns.near b,.sns.full b{color:var(--neon-bg)}
@keyframes throb2{to{transform:scale(1.06)}}
@keyframes shine{to{background-position:300% 0}}
.lcds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lcd{background:var(--lcd);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;box-shadow:inset 0 0 0 1px var(--lcd-rim);min-width:0}
.lcd-l{font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--cab-muted)}
.lcd-v{font-family:var(--f-lcd);font-size:clamp(1.1rem,.9rem + .9vw,1.5rem);line-height:1.15;color:var(--lcd-ink);text-shadow:0 0 8px var(--lcd-glow);font-variant-numeric:tabular-nums;white-space:nowrap}
.lcd-s{font-size:.58em;margin-left:.45em}
.fbar{display:block;height:5px;margin-top:3px;border-radius:3px;background:var(--lcd-dim);overflow:hidden}
.fbar i{display:block;height:100%;width:100%;background:var(--lcd-ink);transform:scaleX(.2);transform-origin:0 50%;transition:transform .25s}
.lcd.hot .lcd-v{color:var(--warn-lcd)}
.lcd.hot .fbar i{background:var(--warn-lcd)}
.mood{margin:0;font-size:.82rem;line-height:1.5;background:var(--cab-3);border-radius:10px;padding:7px 10px;color:var(--cab-muted);display:flex;align-items:center}
.mood b{color:var(--amber)}

.bezel-wrap{position:relative;isolation:isolate}
/* リーチ演出 */
.reach-banner{position:absolute;left:50%;top:50%;z-index:9;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 22px 12px;border-radius:16px;background:rgba(18,0,31,.88);box-shadow:0 0 0 3px var(--neon-pink),0 0 28px var(--neon-pink);pointer-events:none;text-align:center;white-space:nowrap;transition:top .35s ease,transform .35s ease;animation:rbIn .35s cubic-bezier(.2,1.6,.4,1) backwards}
.reach-banner:not(.big){top:0;transform:translate(-50%,-50%) scale(.62)}
.reach-banner b{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,1rem + 3.6vw,3rem);line-height:1.1;color:var(--neon-white);text-shadow:0 0 12px var(--neon-pink),0 0 2px var(--neon-white)}
.reach-banner span{font-weight:700;font-size:clamp(.95rem,.8rem + .8vw,1.3rem);color:var(--neon-yellow)}
.reach-banner.r2{box-shadow:0 0 0 3px var(--sun-3),0 0 32px var(--sun-3)}
.reach-banner.r3{box-shadow:0 0 0 4px var(--hit-red),0 0 44px var(--hit-red);animation:rbIn .35s cubic-bezier(.2,1.6,.4,1) backwards,rbShake .1s linear .35s 6}
.reach-banner.r3 b{color:var(--hit-gold);text-shadow:0 0 14px var(--hit-red),0 0 2px var(--neon-white)}
.reach-banner.rb-win{background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan),var(--neon-pink));background-size:300% 100%;box-shadow:0 0 0 3px var(--neon-white),0 0 48px var(--neon-yellow);animation:rbIn .3s cubic-bezier(.2,1.6,.4,1) backwards,shine 1s linear infinite}
.reach-banner.rb-win b,.reach-banner.rb-win span{color:var(--neon-bg);text-shadow:none}
.reach-banner.rb-lose{background:rgba(38,42,48,.92);box-shadow:0 0 0 3px #6B7380}
.reach-banner.rb-lose b{color:#D3DAE2;text-shadow:none}
.reach-banner.rb-lose span{color:#AEB7C2}
.machine.rch .bezel{animation:reachGlow .5s ease-in-out infinite alternate}
.machine.rch-hot .bezel{animation:reachGlow .2s ease-in-out infinite alternate}
.machine.rch .rc.set .win{filter:brightness(.5) saturate(.7)}
.machine.rch .rc.cur .win{box-shadow:0 0 0 3px var(--neon-yellow),0 0 22px var(--neon-yellow)}
.machine.rch-lose .bezel{filter:grayscale(.9) brightness(.75)}
.machine.rch-win .bezel{animation:winFlash .7s ease-out}
@keyframes reachGlow{from{box-shadow:inset 0 0 0 2px var(--amber-deep),0 0 0 4px var(--neon-pink),0 0 24px var(--neon-pink)}to{box-shadow:inset 0 0 0 2px var(--amber-deep),0 0 0 4px var(--neon-cyan),0 0 40px var(--neon-cyan)}}
@keyframes winFlash{0%{filter:brightness(2.4)}100%{filter:none}}
@keyframes rbIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes rbShake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 5px),-50%)}75%{transform:translate(calc(-50% + 5px),-50%)}}
.rv-unlock{margin:0;padding:8px 12px;border-radius:10px;background:var(--panel-2);font-weight:700;font-size:.88rem}
/* 確定演出: rainbow frame and the freeze veil (先バレ) */
.machine.premium .bezel-wrap::before,.machine.kakutei .bezel-wrap::before{content:"";position:absolute;inset:-7px;z-index:-1;border-radius:22px;background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan),var(--neon-pink));filter:blur(5px);animation:hue 1.6s linear infinite}
.machine.premium .main.stop{background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan));color:var(--neon-bg)}
.machine.frozen .bezel{filter:brightness(.35)}
.freeze{position:absolute;inset:0;z-index:7;display:none;place-items:center;border-radius:16px;background:var(--veil);pointer-events:none}
.machine.frozen .freeze{display:grid}
.freeze span{font-family:var(--f-display);font-size:clamp(3rem,12vw,6rem);line-height:1;color:var(--neon-white);text-shadow:0 0 18px var(--neon-pink),0 0 40px var(--neon-cyan);animation:freezePop .5s cubic-bezier(.2,1.6,.4,1) both,hue 1s linear infinite}
@keyframes freezePop{from{transform:scale(2.5);opacity:0}}
/* --heat は台の枠だけが使う値。中のリールに受け継がせない（受け継ぐと、変えるたびに全部の絵柄を計算し直して重い） */
@property --heat{syntax:"<number>";inherits:false;initial-value:0}
.bezel{display:grid;grid-template-columns:minmax(0,1fr);gap:10px 14px;background:var(--lcd);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 2px var(--amber-deep),0 0 0 4px var(--cab-3);transition:box-shadow .15s,filter .3s;touch-action:manipulation}
@media (min-width:640px){.bezel{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* STOPできる間のカーソルは、リールの上の透明な板にだけ付ける（枠のカーソルを変えると、中の絵柄すべてを計算し直すため） */
.bezel::after{content:"";position:absolute;inset:0;pointer-events:none}
.bezel.tappable::after{pointer-events:auto;cursor:pointer}
.band{display:flex;flex-direction:column;gap:4px;min-width:0}
.band-h{display:flex;align-items:baseline;gap:8px;padding-inline:2px;font-size:.74rem;color:var(--cab-muted)}
.band-h b{font-size:.86rem;color:var(--cab-ink)}
.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.rc{display:flex;flex-direction:column;gap:3px;min-width:0;container-type:inline-size}
.rh{text-align:center;font-family:var(--f-lcd);font-size:.74rem;font-size:min(.78rem,27cqw);line-height:1.2;color:var(--cab-muted);font-variant-numeric:tabular-nums}
.rh small{font-size:.72em}
.rc.cur .rh,.rc.aim .rh{color:var(--amber)}
.win{position:relative;height:calc(var(--H,40px) * 1.7);overflow:hidden;border-radius:8px;background:var(--sky);transition:box-shadow .2s}
.win::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--H,40px);transform:translateY(-50%);border-block:1.5px solid var(--payline);pointer-events:none;z-index:3}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--reel-shade),transparent 32%,transparent 68%,var(--reel-shade));pointer-events:none;z-index:2}
.rc.set .win{box-shadow:0 0 0 2px var(--cat)}
.rc.aim .win{box-shadow:0 0 0 2px var(--stop),0 0 14px var(--stop-glow);animation:aim .7s ease-in-out infinite alternate}
@keyframes aim{to{box-shadow:0 0 0 3px var(--stop),0 0 22px var(--stop-glow)}}
.rc.lucky .win{animation:lucky .45s ease-in-out 3}
@keyframes lucky{50%{box-shadow:0 0 0 3px var(--c-lucky),0 0 20px var(--c-lucky)}}
.sym{position:absolute;left:0;right:0;top:0;height:var(--H,40px);display:flex;align-items:center;justify-content:center;font-family:var(--f-emoji);font-size:calc(var(--H,40px) * .58);line-height:1;will-change:transform;user-select:none;-webkit-user-select:none}
.sym.lk{filter:drop-shadow(0 0 4px var(--c-lucky)) drop-shadow(0 0 2px var(--c-lucky))}
.strip{position:absolute;left:0;right:0;top:0;height:0;will-change:transform}
.strip .sym{top:calc(var(--H,40px) * var(--k) * -1);will-change:auto}
.strip.gone .sym.drink{opacity:.16;filter:grayscale(1)}
/* 行動アイコン: アプリのアイコンのようなタイル（Twitter・YouTubeショートは公式の絵柄） */
.tile{display:inline-grid;place-items:center;flex:none;width:var(--ts,1.35em);height:var(--ts,1.35em);border-radius:24%;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 1px 2px rgba(0,0,0,.3);vertical-align:-.32em}
.tile svg{display:block;width:62%;height:62%;fill:var(--tg,#FFFFFF);overflow:visible}
.sym .tile{--ts:calc(var(--H,40px) * .74)}
.tile-i{margin-right:6px}
.who-ic .tile{--ts:1.15em;vertical-align:middle}
.idc-ic .tile{--ts:1.15em}
.dopa-fx span .tile{--ts:1em}
.chip-g{width:1.05em;height:1.05em;fill:currentColor;flex:none;align-self:center}
.cap{display:flex;justify-content:center;min-height:17px}
.cap span{font-size:9px;font-size:min(10.5px,21cqw);font-weight:700;line-height:16px;padding:0 3px;border-radius:999px;background:var(--cat);color:var(--cat-ink,var(--on-cat));white-space:nowrap}
.cap span.lk{background:var(--c-lucky);color:var(--on-cat-dark)}
.cap span.long{font-size:8px;font-size:min(9px,17cqw);padding:0 2px}
.cap .aim-l{background:var(--stop);color:var(--stop-ink)}
.toast{position:absolute;left:50%;top:8px;transform:translate(-50%,-6px);opacity:0;pointer-events:none;z-index:6;max-width:calc(100% - 16px);background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:.85rem;line-height:1.4;padding:6px 14px;border-radius:999px;text-align:center;box-shadow:0 8px 20px -8px var(--toast-shadow);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn-lcd)}
.toast.neon{background:var(--neon-bg);color:var(--neon-yellow);box-shadow:0 0 0 2px var(--neon-pink),0 0 18px var(--neon-pink)}
/* ランプ（リールの上下を光が流れる）・大きな文字・最後の1本・火花 */
.lamps{position:absolute;left:8px;right:8px;top:-12px;bottom:-12px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s}
.lamps::before,.lamps::after{content:"";position:absolute;left:0;right:0;height:7px;background:radial-gradient(circle,var(--lv-c) 0 2.3px,transparent 3px) 0 50%/14px 7px repeat-x;filter:drop-shadow(0 0 3px var(--lv-c));animation:chase var(--chase) linear infinite}
.lamps::before{top:0}
.lamps::after{bottom:0;animation-direction:reverse}
@keyframes chase{to{background-position:14px 50%}}
.machine[data-lv] .lamps,.machine.kakutei .lamps,.machine.premium .lamps{opacity:1}
.machine[data-lv="5"] .lamps,.machine.kakutei .lamps,.machine.premium .lamps{animation:hue 1s linear infinite}
.callout{position:absolute;left:50%;top:50%;z-index:8;margin:0;pointer-events:none;font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,9vw,4.4rem);line-height:1.1;white-space:nowrap;color:var(--neon-white);-webkit-text-stroke:.04em var(--lv-c);paint-order:stroke fill;text-shadow:0 0 16px var(--lv-c),0 0 40px var(--lv-c);opacity:0;transform:translate(-50%,-50%) rotate(-4deg)}
.callout.rainbow{color:var(--neon-yellow);-webkit-text-stroke:.04em var(--neon-pink);text-shadow:0 0 16px var(--neon-pink),0 0 40px var(--neon-cyan)}
.callout.go{animation:callIn .95s cubic-bezier(.2,1.4,.4,1) both}
.callout.go.rainbow{animation:callIn 1.3s cubic-bezier(.2,1.4,.4,1) both,hue .8s linear infinite}
@keyframes callIn{0%{transform:translate(-50%,-50%) scale(2.6) rotate(-10deg);opacity:0}22%{transform:translate(-50%,-50%) scale(.94) rotate(-4deg);opacity:1}36%{transform:translate(-50%,-50%) scale(1.05) rotate(-4deg);opacity:1}82%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.25) rotate(-4deg);opacity:0}}
.rc.last .win{box-shadow:0 0 0 3px var(--lv-4),0 0 24px var(--lv-4);animation:lastGlow .28s ease-in-out infinite alternate}
.machine[data-lv="5"] .rc.last .win,.machine.kakutei .rc.last .win{box-shadow:0 0 0 3px var(--neon-pink),0 0 26px var(--neon-cyan)}
@keyframes lastGlow{to{transform:scale(1.06)}}
.sparks{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden;contain:strict}
.sparks i{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c),0 0 14px var(--c)}
.mres{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:10px 14px}
.mr-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.mr-t b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.mr-r{font-family:var(--f-hand);font-weight:600;color:#D3343B}
.mr-n{font-size:.88rem;font-weight:700}
.mr-j{border:1px solid var(--paper-edge);background:none;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--paper-ink)}
.main{font-family:var(--f-display);font-size:1.4rem;letter-spacing:.08em;border:0;border-radius:16px;padding:14px;background:var(--amber);color:var(--amber-ink);box-shadow:0 5px 0 var(--amber-deep);cursor:pointer;transition:transform .06s,box-shadow .06s;touch-action:manipulation}
.main:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--amber-deep)}
.main.stop{background:var(--stop);color:var(--stop-ink);box-shadow:0 5px 0 var(--stop-deep),0 0 22px var(--stop-glow)}
.main.stop:active:not(:disabled){box-shadow:0 2px 0 var(--stop-deep)}
.main:disabled{background:var(--cab-3);color:var(--cab-muted);box-shadow:0 5px 0 var(--lcd);cursor:default}
.main.stop:disabled{background:var(--stop-deep);color:var(--stop-ink);box-shadow:0 5px 0 var(--lcd)}
.hint{margin:0;text-align:center;font-size:.78rem;line-height:1.6;color:var(--cab-muted)}
.hint kbd{font-family:var(--f-lcd);font-size:.74rem;padding:0 5px;border-radius:4px;background:var(--cab-3);color:var(--cab-ink)}
@media (hover:none){.kb{display:none}}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h2{margin:0;font-size:1.05rem;line-height:1.4}
.note{margin:8px 0 0;font-size:.82rem;color:var(--muted)}

/* 生活表 */
.chartcard{display:flex;flex-direction:column;gap:12px}
.chart-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px}
.chart-head .sub{font-size:.78rem;color:var(--muted)}
.chart-wrap{width:100%;max-width:400px;margin:0 auto}
#chart{display:block;width:100%;height:auto;overflow:visible}
.wedge{fill:var(--wedge-empty);stroke:var(--panel);stroke-width:1.2;transition:fill .2s}
.wedge[data-cat]{fill:var(--cat)}
.wedge.cur{stroke:var(--amber-deep);stroke-width:2.4}
.wedge.lk{stroke:var(--c-lucky);stroke-width:2.4}
.wemo{font-family:var(--f-emoji);font-size:11px;text-anchor:middle;dominant-baseline:central}
.hlab{font-family:var(--f-body);font-size:7.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.hlab.major{font-size:9.5px;font-weight:700;fill:var(--ink)}
.ctr-l{font-family:var(--f-body);font-size:8.5px;font-weight:700;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.ctr-v{font-family:var(--f-lcd);font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.stamp{transform-box:fill-box;transform-origin:center;transform:rotate(-8deg)}
.stamp.anim{animation:stamp .55s cubic-bezier(.2,.9,.3,1.2) .15s both}
@keyframes stamp{0%{transform:scale(1.9) rotate(-22deg);opacity:0}70%{transform:scale(.95) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.st-fill{fill:var(--panel);opacity:.95}
.st-ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.st-r{stroke:var(--red-ink)}
.st-b{stroke:var(--blue-ink)}
.st-t{font-family:var(--f-hand);font-weight:600;text-anchor:middle;dominant-baseline:central}
.st-rt{fill:var(--red-ink)}
.st-bt{fill:var(--blue-ink)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.82rem}
.legend li{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--cat)}
.legend b{font-variant-numeric:tabular-nums;font-weight:700}
.verdict{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding-top:10px;border-top:1px solid var(--line)}
.v-rank{font-family:var(--f-hand);font-weight:600;color:var(--red-ink);font-size:1.05rem}
.v-title{font-family:var(--f-display);font-size:clamp(1.35rem,1.1rem + .8vw,1.7rem);line-height:1.25;text-wrap:balance}
.v-desc{font-size:.86rem;color:var(--muted)}
.v-score{margin-top:4px;font-size:.9rem;color:var(--muted)}
.v-score b{font-family:var(--f-lcd);font-weight:400;font-size:1.7rem;color:var(--ink);margin-inline:4px}

/* below the machine */
.after{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);margin-top:20px}
@media (min-width:860px){.after{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.after .wide{grid-column:1 / -1}}
.steps{margin:10px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.moods{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.moods li{display:grid;grid-template-columns:minmax(6.5em,auto) minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--panel-2);font-size:.88rem}
.mo-a{font-weight:700;white-space:nowrap}
.mo-a .emo{margin-right:5px}
.mo-m b{margin-right:6px}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.rep-meta{font-size:.8rem;color:var(--muted)}
.story{margin:10px 0 0;font-size:.98rem;line-height:1.9;max-width:68ch}
.chips{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-size:.82rem;padding:3px 12px;border-radius:999px;background:var(--panel-2)}
.chips b{font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table.rep{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.rep th,.rep td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rep thead th{font-size:.72rem;color:var(--muted);letter-spacing:.06em;font-weight:700}
.rep tbody th{font-weight:700;white-space:nowrap}
.rep .g{color:var(--muted);font-size:.8rem}
.rep .num{text-align:right;white-space:nowrap}
.rep td.mk{font-family:var(--f-hand);font-weight:600;font-size:1.4rem;line-height:1;text-align:center;color:var(--red-ink)}
.rep td.mk.m0{color:var(--blue-ink)}
.tag-l{margin-left:6px;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--c-lucky);color:var(--on-cat-dark);vertical-align:2px}
.acts summary{cursor:pointer;font-weight:700;font-size:1.05rem}
.comment{margin-top:14px;padding:10px 14px 12px;border-radius:12px;background:var(--panel-2)}
.comment span{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.08em}
.comment p{margin:2px 0 0;font-family:var(--f-hand);font-weight:600;font-size:1.05rem;line-height:1.7;color:var(--red-ink)}
.yaku{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.yaku li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--panel-2)}
.yaku b{font-size:.93rem}
.yaku small{grid-column:1;color:var(--muted);font-size:.78rem}
.yaku .pts{grid-row:1 / span 2;grid-column:2;font-family:var(--f-lcd);font-size:1.1rem}
.yaku .none{display:block;color:var(--muted);font-size:.88rem}
.pts.pos{color:var(--good)}
.pts.neg{color:var(--bad)}
.breakdown{margin:14px 0 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.breakdown dt{color:var(--muted)}
.breakdown dd{margin:0;text-align:right;font-weight:700}
.breakdown .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-size:1rem;color:var(--ink)}
.sub-h{margin:18px 0 0;font-size:.92rem}
.flow{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:0 18px;font-size:.85rem}
.flow li{display:grid;grid-template-columns:6.6em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line)}
.fl-t,.fl-h{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.fl-a .emo{margin-right:5px}

/* 総評 dialog */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow-y:auto;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rv-card{position:relative;width:min(640px,100%);background:var(--panel);color:var(--ink);border-radius:22px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -24px var(--shadow);animation:rvIn .35s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rvIn{from{transform:translateY(18px) scale(.97);opacity:0}}
#rvBody{display:flex;flex-direction:column;gap:14px}
.rv-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:var(--panel-2);font-size:1.25rem;line-height:1;cursor:pointer}
.rv-eye{margin:0;padding-right:44px;font-size:.78rem;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.rv-head{display:flex;align-items:center;gap:16px}
.rv-stamp{width:96px;height:96px;flex:none;overflow:visible}
.rv-hd{display:flex;flex-direction:column;gap:2px;min-width:0}
/* レア度・図鑑 */
.rv-rare{margin:-6px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.9rem;color:var(--muted)}
.rv-rare b{color:var(--ink)}
.rv-stars,.dex-s,.v-stars{color:var(--hit-gold);letter-spacing:.06em;text-shadow:0 0 1px rgba(0,0,0,.45)}
.rv-stars{font-size:1.25rem;line-height:1}
.rv-new{font-style:normal;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--hit-red);color:#FFFFFF;margin-left:6px;animation:throb2 .5s ease-in-out infinite alternate}
.rv-top,.v-top{margin-left:6px;font-size:.8rem;font-weight:700;color:var(--muted)}
.v-rare{font-size:.84rem;color:var(--muted)}
.v-stars{margin-right:6px}
#dexBtn.has-new{position:relative}
#dexBtn.has-new::after{content:"";position:absolute;top:3px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--hit-red)}
.dex-card{gap:12px}
.dex-h{margin:0;padding-right:40px;font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.dex-tabs{display:flex;gap:6px}
.dex-tabs button{flex:1;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;cursor:pointer}
.dex-tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.dex-sum{margin:0;font-size:.9rem;color:var(--muted)}
.dex-sum b{color:var(--ink);font-size:1.15rem}
.dex-bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.dex-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon-pink),var(--hit-gold))}
.dex-sec{margin:4px 0 0;font-size:1rem}
.dex-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dex-i{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:9px;align-items:center;padding:8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.dex-i .tile{--ts:40px;grid-row:1 / 4}
.dex-n{font-weight:700;font-size:.86rem;line-height:1.3}
.dex-s{font-size:.8rem;line-height:1.2}
.dex-r{font-size:.72rem;color:var(--muted)}
.dex-i.lock .dex-n,.dex-list li.lock b{color:var(--muted)}
.tile.lock{color:#C9D2DC;font-weight:800;font-size:1.05rem}
.dex-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dex-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:8px 10px;border-radius:10px;background:var(--panel-2)}
.dex-list li b{font-size:.95rem}
.dex-d{flex-basis:100%;font-size:.78rem;color:var(--muted)}
.dex-c{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--muted)}
.nw,.rv-score em{white-space:nowrap}
.rv-rank{font-family:var(--f-hand);font-weight:600;color:var(--red-ink)}
.rv-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,1.2rem + 1.2vw,2rem);line-height:1.2;text-wrap:balance}
.rv-score{font-size:.9rem;color:var(--muted)}
.rv-score b{font-family:var(--f-lcd);font-weight:400;font-size:1.6rem;color:var(--ink);margin-right:2px}
.rv-score em{font-style:normal;font-weight:700;color:var(--red-ink);margin-left:8px;font-size:.8rem}
.rv-bar{display:flex;flex-direction:column;gap:4px}
.rv-text{margin:0;font-size:.98rem;line-height:1.9}
.rv-teacher{padding:10px 14px 12px;border-radius:12px;background:var(--panel-2)}
.rv-teacher span{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.08em}
.rv-teacher p{margin:2px 0 0;font-family:var(--f-hand);font-weight:600;font-size:1.05rem;color:var(--red-ink)}
.rv-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rv-btns .main{flex:1 1 200px}
/* ドパガキ診断の見出しと、シェア */
.rv-head2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.3rem,1rem + 1.5vw,1.85rem);line-height:1.35;text-wrap:balance}
.rv-head2 em,.story-head em{font-style:normal;color:var(--red-ink);white-space:nowrap}
.rv-img{margin:0;display:flex;flex-direction:column;gap:4px}
.rv-img img,.rv-img canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:16 / 9;border-radius:12px;background:var(--panel-2)}
.rv-img figcaption{font-size:.75rem;color:var(--muted)}
.rv-share{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.x-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:0;border-radius:999px;background:var(--x-bg);color:var(--x-ink);box-shadow:inset 0 0 0 1px var(--x-line);font:inherit;font-weight:700;font-size:.95rem;text-decoration:none;cursor:pointer}
.x-btn:hover{opacity:.85}
a.ghost{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.x-ic{width:1.05em;height:1.05em;fill:currentColor;flex:none}
.share-msg{margin:0;font-size:.8rem;color:var(--muted)}
.shared-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:20px;padding:12px 16px;border-radius:16px;background:var(--panel);border:2px solid var(--amber)}
.shared-banner p{margin:0;font-size:.92rem;min-width:0}
.story-head{margin:10px 0 0;font-family:var(--f-display);font-weight:400;font-size:1.2rem;line-height:1.4;text-wrap:balance}

/* プチュン: 画面が一瞬で消える（ブラウン管を切ったように、光が横線→点になって消える）。そのあと無音の暗闇 */
.puchun{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--crt-off);pointer-events:none}
.puchun i{grid-area:1/1;width:100%;height:100%;background:var(--neon-white);opacity:0;box-shadow:0 0 24px var(--neon-white)}
.puchun.off i{animation:crtOff .62s linear both}
@keyframes crtOff{0%{opacity:.6;transform:scale(1,1)}18%{opacity:1;transform:scale(1,.006)}36%{opacity:1;transform:scale(.06,.006)}42%{opacity:1;transform:scale(.012,.012)}100%{opacity:0;transform:scale(.012,.012)}}
.puchun.back{animation:puBack .5s ease-out both}
@keyframes puBack{from{background-color:var(--neon-white)}to{background-color:transparent}}

/* ドパガキ: full-screen dopamine show (color cycling and motion, no strobe flashes) */
.dopa{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:var(--neon-bg);cursor:pointer;animation:dopaIn .2s ease-out both}
@keyframes dopaIn{from{opacity:0}}
.dopa-rays{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(var(--neon-pink) 0deg 9deg,var(--neon-bg) 9deg 18deg,var(--neon-cyan) 18deg 27deg,var(--neon-bg) 27deg 36deg,var(--neon-yellow) 36deg 45deg,var(--neon-bg) 45deg 54deg);opacity:.5;animation:spin 7s linear infinite,hue 3s linear infinite}
.dopa::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0 22%,var(--neon-bg) 75%);opacity:.85;pointer-events:none}
.dopa-fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.dopa-fx span{position:absolute;left:50%;top:50%;font-family:var(--f-emoji);font-size:var(--s,2rem);line-height:1;animation:burst var(--d,1.6s) cubic-bezier(.1,.7,.3,1) var(--delay,0s) both}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1.1);opacity:0}}
.dopa-fx .bub{font-family:var(--f-body);font-size:clamp(.8rem,2.4vw,1.05rem);font-weight:700;white-space:nowrap;padding:6px 14px;border-radius:999px;background:var(--neon-white);color:var(--neon-pink);box-shadow:0 8px 24px -6px var(--neon-pink);animation:bub 1.9s ease-out var(--delay,0s) both}
@keyframes bub{0%{transform:translate(-50%,-50%) scale(0);opacity:0}18%{transform:translate(-50%,-50%) scale(1.18);opacity:1}28%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.dopa-core{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-inline:16px;opacity:0;animation:coreIn .2s ease-out 1.05s both,shake .45s linear 1.05s}
.dopa-k{margin:0;font-weight:700;letter-spacing:.4em;padding-left:.4em;color:var(--neon-yellow);font-size:clamp(.85rem,2.6vw,1.2rem)}
.dopa-word{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(4.2rem,23vw,15rem);line-height:1.05;color:var(--neon-white);white-space:nowrap;text-shadow:0 0 10px var(--neon-white),0 0 28px var(--neon-pink),0 0 60px var(--neon-pink),.06em 0 0 var(--neon-cyan),-.06em 0 0 var(--neon-pink);animation:punch .7s cubic-bezier(.2,1.6,.4,1) 1.05s both,throb .45s ease-in-out 1.75s infinite alternate,hue 1.8s linear infinite}
@keyframes punch{0%{transform:scale(4) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
@keyframes throb{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.07) rotate(2deg)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.dopa-sub{margin:0;color:var(--neon-white);font-weight:700;font-size:clamp(1rem,3.4vw,1.5rem);text-shadow:0 0 12px var(--neon-cyan)}
.dopa-meter{margin:0;color:var(--neon-white);font-weight:700;font-size:clamp(.95rem,3vw,1.3rem)}
.dopa-meter{animation:maxPop .6s cubic-bezier(.2,1.6,.4,1) 2.85s both}
@keyframes maxPop{35%{transform:scale(1.4)}}
.dopa-meter b{font-family:var(--f-lcd);font-weight:400;font-size:1.7em;color:var(--neon-yellow);text-shadow:0 0 12px var(--neon-yellow);margin-inline:6px;font-variant-numeric:tabular-nums}
.dopa-skip{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2;margin:0;text-align:center;font-size:.8rem;color:var(--neon-white);opacity:.7}
.dopa-badge{display:inline-block;align-self:flex-start;padding:.08em .35em .12em;border-radius:12px;background:var(--neon-bg);color:var(--neon-pink);text-shadow:0 0 8px var(--neon-pink),0 0 18px var(--neon-pink);animation:hue 2.4s linear infinite}
.v-title.dopa-badge{align-self:center}
.dopa-pre{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,10vw,6rem);line-height:1;color:var(--neon-yellow);text-shadow:0 0 16px var(--neon-yellow),0 0 40px var(--neon-pink);animation:punch .6s cubic-bezier(.2,1.6,.4,1) 1.05s both,hue 1.2s linear infinite}
.dopa.premium .dopa-rays{opacity:.8;animation-duration:3s,1.2s}
.dopa.premium .dopa-word{background:linear-gradient(90deg,var(--neon-yellow),var(--neon-pink),var(--neon-cyan),var(--neon-yellow));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px var(--neon-pink)) drop-shadow(0 0 32px var(--neon-cyan));animation:punch .7s cubic-bezier(.2,1.6,.4,1) 1.3s both,throb .35s ease-in-out 2s infinite alternate,shine 1s linear infinite}
/* パチンコの大当たり風: 最初に「大当たり」、白いフラッシュ（2回だけ）、点滅するランプ、ゆれ */
.dopa::before{content:"";position:absolute;inset:0;z-index:6;background:var(--neon-white);opacity:0;pointer-events:none;animation:flash .5s ease-out,flash .5s ease-out 1.05s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes coreIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-10px 6px}40%{translate:9px -7px}60%{translate:-7px -4px}80%{translate:6px 5px}}
.dopa-hit{position:absolute;z-index:3;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(3.5rem,20vw,13rem);line-height:1;white-space:nowrap;color:var(--hit-gold);-webkit-text-stroke:.035em var(--hit-red);paint-order:stroke fill;text-shadow:0 .06em 0 var(--hit-red),0 0 34px var(--hit-gold),0 0 80px var(--hit-red);pointer-events:none;opacity:0;animation:hitIn 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes hitIn{0%{transform:scale(3.2) rotate(-10deg);opacity:0}25%{transform:scale(.92) rotate(-4deg);opacity:1}40%{transform:scale(1.05) rotate(-4deg);opacity:1}80%{transform:scale(1) rotate(-4deg);opacity:1}100%{transform:scale(1.7) rotate(-4deg);opacity:0}}
.dopa-lamps{position:absolute;inset:0;z-index:4;pointer-events:none}
.dopa-lamps i{position:absolute;inset:10px;border-radius:28px;border:7px dotted var(--neon-yellow);filter:drop-shadow(0 0 6px var(--neon-yellow));animation:lampA .8s steps(1) infinite}
.dopa-lamps i + i{inset:22px;border-color:var(--neon-pink);filter:drop-shadow(0 0 6px var(--neon-pink));animation-name:lampB}
@keyframes lampA{0%{opacity:1}50%{opacity:.15}}
@keyframes lampB{0%{opacity:.15}50%{opacity:1}}
/* 朝まで飲み会: sunrise version */
.dopa.nomi{background:linear-gradient(180deg,var(--sun-1) 0%,var(--sun-2) 45%,var(--sun-3) 75%,var(--sun-4) 100%)}
.dopa.nomi .dopa-rays{background:repeating-conic-gradient(var(--sun-4) 0deg 8deg,transparent 8deg 16deg);opacity:.35;animation:spin 9s linear infinite}
.dopa.nomi::after{background:radial-gradient(circle at 50% 80%,transparent 0 30%,var(--nomi-shade) 80%)}
.dopa.nomi .dopa-hit{font-size:clamp(3rem,16vw,11rem)}
.dopa.nomi .dopa-word{font-size:clamp(2.6rem,13vw,9rem);text-shadow:0 0 14px var(--sun-4),0 0 40px var(--sun-3),.05em .05em 0 var(--sun-2);animation:punch .7s cubic-bezier(.2,1.6,.4,1) 1.05s both,throb .45s ease-in-out 1.75s infinite alternate}
.dopa.nomi .dopa-k,.dopa.nomi .dopa-meter b{color:var(--sun-4)}
.dopa.nomi .dopa-sub{text-shadow:0 0 12px var(--sun-2)}
.dopa.nomi .dopa-lamps i{border-color:var(--sun-4)}
.dopa.nomi .dopa-lamps i + i{border-color:var(--neon-white)}
.nomi-badge{display:inline-block;align-self:flex-start;padding:.08em .35em .12em;border-radius:12px;background:linear-gradient(90deg,var(--sun-2),var(--sun-3),var(--sun-4));color:var(--sun-1)}
.v-title.nomi-badge{align-self:center}

/* ===== 軽量化（スマホで重くならないように） ===== */
/* 台のまわりの光: 後ろの1枚の明るさ（opacity）だけを変える。枠は描き直さない */
.glow{position:absolute;inset:0;z-index:-1;border-radius:16px;box-shadow:0 0 30px 3px var(--lv-c);opacity:0;transition:opacity .15s;pointer-events:none;will-change:opacity}
/* ランプは見えていないあいだ止めておく */
.lamps::before,.lamps::after{animation-play-state:paused}
.machine[data-lv] .lamps::before,.machine[data-lv] .lamps::after,.machine.kakutei .lamps::before,.machine.kakutei .lamps::after,.machine.premium .lamps::before,.machine.premium .lamps::after{animation-play-state:running}
/* 火花はCSSのアニメーションで飛ばす（JSで1個ずつ動かさない） */
.sparks i{animation:spark var(--d,520ms) cubic-bezier(.1,.7,.3,1) both}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:0}}
/* 下の長いレポートは、画面に入るまで並べない・描かない */
.after > *{content-visibility:auto;contain-intrinsic-size:auto 520px}
/* 知らせ（トースト）は文字の長さで幅を決める（真ん中寄せのせいで半分の幅で折り返さないように） */
.toast{width:max-content}
/* 大当たり画面のメーター: 数字が変わっても、まわりを並べ直さない */
.dopa-meter b{display:inline-block;min-width:6.4ch;text-align:center;contain:layout}
/* スマホ: ずっと続く色相・きらめきは止める（毎フレーム描き直しになるため）。光線は小さく描いて拡大する */
.lite .sns.full,.lite .dopa-badge{animation:none}
.lite .reach-banner.rb-win{animation:rbIn .3s cubic-bezier(.2,1.6,.4,1) backwards}
.lite .rc.aim .win{animation:none}
.lite .dopa-rays{width:80vmax;height:80vmax;margin:-40vmax 0 0 -40vmax;animation:raysLite 7s linear infinite;will-change:transform}
.lite .dopa.premium .dopa-rays{animation-duration:3s}
.lite .dopa.nomi .dopa-rays{animation:raysLite 9s linear infinite}
@keyframes raysLite{from{transform:scale(2.4) rotate(0deg)}to{transform:scale(2.4) rotate(360deg)}}
.lite .dopa-word{animation:punch .7s cubic-bezier(.2,1.6,.4,1) 1.05s both,throb .45s ease-in-out 1.75s infinite alternate}
.lite .dopa.premium .dopa-word{animation:punch .7s cubic-bezier(.2,1.6,.4,1) 1.3s both,throb .35s ease-in-out 2s infinite alternate}
.lite .dopa-pre{animation:punch .6s cubic-bezier(.2,1.6,.4,1) 1.05s both}

/* ===== 軽量化その2 ===== */
/* 生活表は画面に入っていないあいだ描かない（スマホでは台の下にあるので、回している間は描かずに済む） */
.chartcard{content-visibility:auto;contain-intrinsic-size:auto 560px}
/* 大当たり画面: 画面いっぱいの重ね板を減らす。周りを暗くする膜は光線の中に描き、ランプの輪は1本にする */
.lite .dopa::after{display:none}
.lite .dopa-rays{background:radial-gradient(circle at 50% 50%,transparent 0 5vmax,var(--neon-bg) 18vmax),repeating-conic-gradient(var(--neon-pink) 0deg 9deg,var(--neon-bg) 9deg 18deg,var(--neon-cyan) 18deg 27deg,var(--neon-bg) 27deg 36deg,var(--neon-yellow) 36deg 45deg,var(--neon-bg) 45deg 54deg)}
.lite .dopa-lamps i + i{display:none}
/* 動きの重い端末では、さらに飾りを減らす（自動で切り替わる） */
.ultra .lamps,.ultra .glow,.ultra .machine::after,.ultra .sparks,.ultra .dopa-lamps,.ultra .machine.premium .bezel-wrap::before,.ultra .machine.kakutei .bezel-wrap::before{display:none}
.ultra .callout{text-shadow:none}
.ultra .dopa-rays{animation:none}
.ultra .dopa-fx span:not(.bub){display:none}

/* ===== 軽量化その3 ===== */
/* スマホは本文を端末の字体で（Webフォントが届くたびに、リールを含むページ全体を並べ直すのを防ぐ）。見出し・手書き・数字の字体はそのまま */
.lite{--f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",system-ui,sans-serif}

/* ===== 軽量化その4 ===== */
/* スマホは、止まったリールの枠の色をすぐ出す（ふわっと出す間、毎フレーム描き直しになるため） */
.lite .win{transition:none}

/* ===== 軽量化その5 ===== */
/* 結果のハンコは、外側の箱ごと大きさを変える（中の図の大きさを変えると、ハンコの文字を毎コマ並べ直すため）。動きは前と同じ */
/* 見えないまま組み立てておく間（ほぼ透明にして、描くところまで済ませておく・さわれない・カードの出てくる動きは止めておく） */
.overlay.pre{opacity:.001;pointer-events:none}
.overlay.pre .rv-card{animation-play-state:paused}
.rv-stamp.anim{animation:stampR .55s cubic-bezier(.2,.9,.3,1.2) .15s both}
@keyframes stampR{0%{transform:scale(1.9) rotate(-14deg);opacity:0}70%{transform:scale(.95) rotate(0deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .dopa-rays,.dopa-fx,.sparks{display:none}
  .callout.go,.callout.go.rainbow{animation:none!important;opacity:1}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1 class="logo">ドパガキスロット</h1>
      <p class="tag">24本のリールで、今日のドーパミンが決まる。</p>
    </div>
    <div class="tools">
      <button type="button" class="ghost" id="switchBtn" hidden>身分を変える</button>
      <button type="button" class="ghost" id="dexBtn">図鑑</button>
      <button type="button" class="ghost" id="skipBtn" aria-pressed="false" hidden>演出スキップ：OFF</button>
      <button type="button" class="ghost" id="soundBtn" aria-pressed="true">音：ON</button>
    </div>
  </header>

  <section class="select" id="selectView" aria-labelledby="selH">
    <h2 class="sel-h" id="selH">どのドパガキで回しますか？</h2>
    <p class="sel-sub">身分をえらぶと、リールに出てくる行動が変わります。</p>
    <div class="sel-grid" id="idGrid"></div>
  </section>

  <div id="gameView" hidden>
    <div class="shared-banner" id="sharedBanner" hidden>
      <p><b>シェアされた結果</b>を表示しています（<span id="sharedWho"></span>）。この人の24時間を見たら、自分も回してみましょう。</p>
      <button type="button" class="ghost" id="playMine">自分も回してみる</button>
    </div>
    <div class="game">
      <section class="machine" aria-label="スロットマシン">
        <div class="mtop">
          <div class="who"><span class="who-ic" id="whoIc" aria-hidden="true"></span><b id="whoN"></b><span class="who-s">の一日</span><span class="sns" id="snsChip"><svg class="chip-g" viewBox="0 -960 960 960" aria-hidden="true"><path d="M260-40q-25 0-42.5-17.5T200-100v-760q0-24 18-42t42-18h438q25 0 42.5 17.5T758-860v150q18 3 30 17t12 32v74q0 19-12 33t-30 17v437q0 25-17.5 42.5T698-40H260Zm240-689q9-9 9-21t-9-21q-9-9-21-9t-21 9q-9 9-9 21t9 21q9 9 21 9t21-9Z"/></svg>SNS<b id="snsV">0</b>時間<small>／12でドパガキ</small></span></div>
          <div class="lcds">
            <div class="lcd" id="fatBox"><span class="lcd-l">疲労度</span><span class="lcd-v"><span id="fatV">20</span><small class="lcd-s" id="fatL">ふつう</small></span><span class="fbar"><i id="fatBar"></i></span></div>
            <div class="lcd"><span class="lcd-l">幸福度</span><span class="lcd-v" id="joyV">0</span></div>
          </div>
          <p class="mood" id="mood"></p>
        </div>
        <div class="bezel-wrap">
          <div class="glow" id="glow" aria-hidden="true"></div>
          <div class="bezel" id="bezel"></div>
          <div class="lamps" aria-hidden="true"></div>
          <div class="freeze" aria-hidden="true"><span>！？</span></div>
          <p class="callout" id="callout" aria-hidden="true"></p>
          <div class="reach-banner" id="reachBanner" role="status" hidden><b id="rbMain"></b><span id="rbSub"></span></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
        <div class="mres" id="mres" hidden></div>
        <button type="button" class="main" id="mainBtn">START</button>
        <p class="hint"><span id="hint"></span><span class="kb">　<kbd>Space</kbd> キーでも操作できます</span></p>
      </section>

      <section class="card chartcard" id="chartCard" aria-labelledby="chartH">

const rareRate = (k, kind, name) => name === '完全ドパガキ' ? PREMIUM_P : Math.max(RARE[k][kind][name] || 0, 0.5) / RARE[k].n;

function perPeople(r){
  if (Math.round(r * 1000) >= 10) return `100人に${Math.round(r * 100)}人`;
  if (Math.round(r * 10000) >= 10) return `1000人に${Math.round(r * 1000)}人`;
  if (Math.round(r * 100000) >= 10) return `1万人に${Math.round(r * 10000)}人`;
  return '10万人に1人以下';
}

function topText(k, score){
  const below = RARE[k].q.filter(v => v < score).length, top = 100 - below;
  return top <= 50 ? `上位${Math.max(1, top)}%` : `下位${below + 1}%`;

function finishDay(){
  if (!RUN) return;
  setTimeout(() => sweepSparks(true), 900);
  reachClear();
  const ids = RUN.ids.slice(), ev = evaluate(S.id, ids), kind = showKind(ev);
  // 確認用の記録（画面には出ない）: 6時で先に決めた結果 / 実際の結果 / いちばん大きいすべり（コマ）
  $('#bezel').dataset.check = `${RUN.kind || '-'}/${kind || '-'}/${RUN.slip.toFixed(2)}`;
  const prev = S.best[S.id], newBest = !prev || ev.score > prev.score;
  if (newBest) S.best[S.id] = {score: ev.score, rank: ev.rank};
  S.today = Object.assign({id: S.id, ids, pos: RT.map(r => r.p), mood: RUN.ctx.mood, ev, newBest}, recordDex(S.id, ev));
  if (!SHARED && playCount() === SKIP_AFTER) S.today.skipUnlocked = true;
  if (!ULTRA && RUN.fN > 30 && RUN.fSlow / RUN.fN > 0.35) { ULTRA = true; try { localStorage.setItem(PERF_KEY, '1'); } catch (e) {} setTimeout(() => whenIdle(() => document.documentElement.classList.add('ultra'), 4000), 2500); }   // 切り替えはページ全体の計算し直しになるので、結果を読んでいる間の手が空いたときに   // この端末では重そうなので、次から飾りを減らす
  S.phase = 'done';
  RUN = null;
  setLevel(0);
  save();
  const t = S.today;
  if (kind) {
    afterLater = true;
    makeShare(t);   // 結果の画像は、最後のリールが止まった直後から描いている
    let rendered = false;
    const later = () => { if (!rendered && S.today === t && S.phase === 'done') { rendered = true; renderAll({stamp: true, later: true}); } };
    bigShow(kind, ev).then(() => openReview(true, () => setTimeout(() => { if (!rendered) { later(); afterLater = false; } }, 0)));
    setTimeout(() => { if (!$('#dopa').hidden) later(); }, 350);   // 演出が続いていれば、その陰で書き換える
  } else {
    afterLater = true;
    makeShare(t);   // 結果の画像をすぐ作り始める
    // 画像ができたら、ポップアップと結果の音をいっしょに出す（ハンコの絵と音がそろう）。後ろのページは、そのあとで書き換える（ポップアップに隠れているので、見た目は同じ）
    openReview(true, () => {
      if (S.skip) sfx.quick(kind, ev.rank); else sfx.fanfare(ev.rank);
      setTimeout(() => { if (S.phase === 'done' && S.today) { renderAll({stamp: true, later: true}); afterLater = false; } }, 0);
    });
  }
}

const polar = (r, pos) => { const a = pos / 24 * Math.PI * 2 - Math.PI / 2; return [r * Math.cos(a), r * Math.sin(a)]; };
function wedgePath(h, r0, r1){
  const f = n => n.toFixed(2);
  const [x0, y0] = polar(r1, h), [x1, y1] = polar(r1, h + 1), [x2, y2] = polar(r0, h + 1), [x3, y3] = polar(r0, h);
  return `M${f(x0)} ${f(y0)}A${r1} ${r1} 0 0 1 ${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}A${r0} ${r0} 0 0 0 ${f(x3)} ${f(y3)}Z`;
}
function buildChart(){
  let s = `<defs>${Object.entries(TILE).map(([k, [c1, c2]]) => `<linearGradient id="tg-${k}" x1="0" y1="0" x2=".36" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`).join('')}</defs>`;
  for (let h = 0; h < 24; h++) s += `<path class="wedge" id="w${h}" d="${wedgePath(h, 40, 96)}"/>`;
  for (let h = 0; h < 24; h++) { const [x, y] = polar(69, h + 0.5); s += `<text class="wemo" id="we${h}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"></text><g id="wi${h}"></g>`; }
  for (let h = 0; h < 24; h++) { const [x, y] = polar(107, h); s += `<text class="hlab${h % 6 === 0 ? ' major' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${h}</text>`; }
  s += '<g id="ctr"></g>';
  $('#chart').innerHTML = s;
}
function paintWedges(ids){
  for (let h = 0; h < 24; h++) {
    const w = document.getElementById(`w${h}`);
    w.removeAttribute('data-cat'); w.classList.remove('cur', 'lk');
    document.getElementById(`we${h}`).textContent = '';
    document.getElementById(`wi${h}`).innerHTML = '';

function fillWedge(i, a){
  const h = HOURS[i], w = document.getElementById(`w${h}`);
  w.setAttribute('data-cat', a.cat); w.classList.remove('cur'); w.classList.toggle('lk', a.L);

function stampSVG(rank, anim){
  const cls = anim && !reduceMotion ? 'stamp anim' : 'stamp';
  if (rank === 'S') {
    let d = '', sp = '';
    for (let k = 0; k <= 12; k++) { const [x, y] = polar(37, k * 2); d += (k ? 'A10.4 10.4 0 0 1 ' : 'M') + `${x.toFixed(2)} ${y.toFixed(2)}`; }
    for (let k = 0; k <= 60; k++) { const t = k / 60, a = t * Math.PI * 4.3 - Math.PI / 2, rr = 2.5 + t * 23; sp += (k ? 'L' : 'M') + `${(rr * Math.cos(a)).toFixed(2)} ${(rr * Math.sin(a)).toFixed(2)}`; }
    return `<g class="${cls}"><path class="st-fill" d="${d}Z"/><path class="st-ln st-r" d="${d}Z" stroke-width="3"/><path class="st-ln st-r" d="${sp}" stroke-width="3.2"/></g>`;
  }

  const lines = {A: ['よく', 'できました'], B: ['もう', 'すこし'], C: ['がんばり', 'ましょう']}[rank];

}

      + '<div class="toast show">ドーパミン出てきた…ラッキー！ヘトヘト… 眠くなってきた 疲労度 限界突破！ バタンキュー 二次会へ！終電、逃しました まだ飲む！？ 始発まであと少し… 朝まで飲み会 達成！！ 飲み会おひらき（今日はもう出ません）ドパガキまで あと時間…なのに時間切れ 完全ドパガキ！！！先バレ！ ドパガキ確定 フリーズ発生！ 確定演出 ' + P.A.map(a => a.n).join('') + '</div>'
      + `<div class="rc" style="width:${(RT[0] && RT[0].rc.offsetWidth) || 56}px"><div class="cap"><span>${P.A.map(a => a.s).join('')}</span></div><div class="cap"><span class="long">${P.A.map(a => a.s).join('')}</span></div></div>`
      + `<div class="lcd"><span class="lcd-v">0123456789<small class="lcd-s">${FAT_LABELS.map(x => x[1]).join('')}</small></span></div>`
      + '<p class="rv-text">💼🛌📲🌈🔥🏃🥫🥐👔🚃👥🔔💰🛵💤📱☕🍰💻🍻🍜🏋🚶💪🛁🧺🎰💜📰🍕💌🐦▶🎒🎁👕🎧📚📝🤫🍙🏫🏠📺✏📖🎮💯😳✨❤👍🤳💥⚡🌀♥🍺🥂🍶🌅🎉🍢 −→〜△○◎々〇★☆＋＝＆</p>';   // 絵文字・記号の字体も（初めて出るときに大きなファイルを読む）
  } catch (e) { html = ''; } finally { Math.random = R; }
  if (!html) return;
  const box = document.createElement('div');
  box.className = 'warm-box'; box.setAttribute('aria-hidden', 'true'); box.inert = true;
  box.style.cssText = 'position:absolute;left:-9999px;top:0;width:360px;visibility:hidden;pointer-events:none;contain:layout style';
  box.innerHTML = '<style>.warm-box *,.warm-box *::before,.warm-box *::after{animation:none!important;transition:none!important}.warm-box .after>*{content-visibility:visible!important}</style>'
    + html.replace(/ (id|for|aria-labelledby)="[^"]*"/g, '').replace(/ (href|src)="[^"]*"/g, '');
  // 1つずつ並べる（ポップアップ、レポートの各部分、ハンコ）
  const parts = [...box.children].filter(x => x.tagName !== 'STYLE').flatMap(x => x.classList.contains('after') ? [...x.children] : [x]);
  parts.forEach(x => { x.style.display = 'none'; });
  document.body.appendChild(box);
  // 見出し・手書き・数字の字体の文字は、もう読み込んである文字に置きかえる（ほかの文字だと、読み込みや代わりの字体が動いてしまう）
  const tw = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
  for (let n; (n = tw.nextNode());) {
    const el = n.parentElement;
    if (!el || el.tagName === 'STYLE') continue;
    const f = getComputedStyle(el).fontFamily.split(',')[0];
    if (/Dela/.test(f)) n.nodeValue = WARM_D.slice(0, n.nodeValue.length + 6);
    else if (/Klee/.test(f)) n.nodeValue = WARM_K;
    else if (/DotGothic/.test(f)) n.nodeValue = [...n.nodeValue].filter(c => WARM_L.includes(c)).join('') || '0';   // 読み込んである文字だけ
  }
  const step = () => {
    if (RUN) { setTimeout(() => whenIdle(step, 8000), 3000); return; }   // 遊んでいる最中はやらない
    const x = parts.shift();
    if (!x) { box.remove(); return; }
    x.style.display = '';
    void box.offsetHeight;   // ここで並べる（1つずつ、手が空いたときに）
    whenIdle(step, 8000);
  };
  whenIdle(step, 8000);
}
boot(null);
})();
</script>
